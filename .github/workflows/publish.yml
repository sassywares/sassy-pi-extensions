name: Publish

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest

    steps:
      - name: Check out
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Update npm
        run: npm install -g npm@latest

      - name: Check tag matches package version
        run: |
          version="$(node -p "require('./package.json').version")"
          tag="${GITHUB_REF_NAME#v}"
          if [ "$version" != "$tag" ]; then
            echo "::error::package.json version $version does not match tag $tag"
            exit 1
          fi

      # Stable versions ship from main; prereleases ship from their branch under their own
      # dist-tag, so a profile like 0.4.0-anthropic never becomes `latest`.
      - name: Resolve release channel
        id: channel
        run: |
          version="$(node -p "require('./package.json').version")"
          git fetch --no-tags origin main:refs/remotes/origin/main
          if [ "$version" = "${version%%-*}" ]; then
            echo "channel=stable" >> "$GITHUB_OUTPUT"
            echo "dist-tag=latest" >> "$GITHUB_OUTPUT"
            if ! git merge-base --is-ancestor HEAD refs/remotes/origin/main; then
              echo "::error::stable release $version is not on main; tag it from main"
              exit 1
            fi
          else
            tag="${version#*-}"
            tag="${tag%%.*}"
            if ! printf '%s' "$tag" | grep -Eq '^[a-z][a-z0-9-]*$'; then
              echo "::error::cannot derive a dist-tag from version $version"
              exit 1
            fi
            echo "channel=prerelease" >> "$GITHUB_OUTPUT"
            echo "dist-tag=$tag" >> "$GITHUB_OUTPUT"
            if [ "$tag" = "latest" ]; then
              echo "::error::a prerelease may not publish to the latest dist-tag"
              exit 1
            fi
            if [ "$tag" = "anthropic" ]; then
              bash scripts/check-anthropic-branch.sh refs/remotes/origin/main
            fi
          fi

      # Allows the one-time manual bootstrap publish of a new package.
      - name: Check if the version is already published
        id: published
        run: |
          if npm view "@sassywares/pi-extensions@${GITHUB_REF_NAME#v}" version >/dev/null 2>&1; then
            echo "already-published=true" >> "$GITHUB_OUTPUT"
          else
            echo "already-published=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Publish to npm
        if: steps.published.outputs.already-published != 'true'
        run: npm publish --tag "${{ steps.channel.outputs.dist-tag }}"
